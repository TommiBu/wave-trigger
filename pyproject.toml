[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wave-trigger"
version = "0.1.0"
description = "Detect a wave in a video stream and run any action you like"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tomáš Buzek" }]
keywords = ["computer-vision", "pose-estimation", "gesture-recognition", "yolo", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "torch>=2.4",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
onnx = ["onnxruntime>=1.18"]

[project.urls]
Homepage = "https://github.com/TommiBu/wave-trigger"

[tool.hatch.build.targets.wheel]
packages = ["src/wave_trigger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
